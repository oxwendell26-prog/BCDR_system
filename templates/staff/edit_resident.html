{% extends "base.html" %}

{% block title %}Edit Resident Profile{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 2rem auto; padding: 0 1rem;">
    <div
        style="background: #ffffff; border-radius: 12px; padding: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
        <div
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem; padding-bottom: 1rem; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1 style="font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: 0.25rem;">Edit Resident
                    Profile</h1>
                <p style="color: #64748b; font-size: 0.9rem; margin: 0;">Update resident details, including name and
                    birthdate upon verification at the barangay hall.</p>
            </div>
            <a href="{{ url_for('residents_list') }}"
                style="display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.5rem 1rem; background-color: #f1f5f9; color: #475569; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease;"
                onmouseover="this.style.backgroundColor='#e2e8f0'; this.style.color='#1e293b';"
                onmouseout="this.style.backgroundColor='#f1f5f9'; this.style.color='#475569';">
                &larr; Back to List
            </a>
        </div>

        <form method="post">
            <div
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem;">
                <div>
                    <label
                        style="display: block; font-weight: 600; font-size: 0.875rem; color: #334155; margin-bottom: 0.35rem;">First
                        Name <span style="color: #dc2626;">*</span></label>
                    <input type="text" name="first_name" value="{{ resident.first_name }}" required
                        style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; outline: none;"
                        onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.15)';"
                        onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';">
                </div>
                <div>
                    <label
                        style="display: block; font-weight: 600; font-size: 0.875rem; color: #334155; margin-bottom: 0.35rem;">Middle
                        Name</label>
                    <input type="text" name="middle_name" value="{{ resident.middle_name or '' }}"
                        style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; outline: none;"
                        onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.15)';"
                        onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';">
                </div>
            </div>

            <div
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem;">
                <div>
                    <label
                        style="display: block; font-weight: 600; font-size: 0.875rem; color: #334155; margin-bottom: 0.35rem;">Last
                        Name <span style="color: #dc2626;">*</span></label>
                    <input type="text" name="last_name" value="{{ resident.last_name }}" required
                        style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; outline: none;"
                        onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.15)';"
                        onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';">
                </div>
                <div>
                    <label
                        style="display: block; font-weight: 600; font-size: 0.875rem; color: #334155; margin-bottom: 0.35rem;">Birthdate
                        <span style="color: #dc2626;">*</span></label>
                    <input type="date" name="birthdate" value="{{ resident.birthdate }}" required
                        style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; outline: none;"
                        onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.15)';"
                        onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';">
                </div>
            </div>

            <div
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem;">
                <div>
                    <label
                        style="display: block; font-weight: 600; font-size: 0.875rem; color: #334155; margin-bottom: 0.35rem;">Sex
                        <span style="color: #dc2626;">*</span></label>
                    <select name="sex" required
                        style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; background: #fff; outline: none;"
                        onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.15)';"
                        onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';">
                        <option value="Male" {% if resident.sex=='Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if resident.sex=='Female' %}selected{% endif %}>Female</option>
                    </select>
                </div>
                <div>
                    <label
                        style="display: block; font-weight: 600; font-size: 0.875rem; color: #334155; margin-bottom: 0.35rem;">Civil
                        Status <span style="color: #dc2626;">*</span></label>
                    <select name="civil_status" required
                        style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; background: #fff; outline: none;"
                        onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.15)';"
                        onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';">
                        <option value="Single" {% if resident.civil_status=='Single' %}selected{% endif %}>Single
                        </option>
                        <option value="Married" {% if resident.civil_status=='Married' %}selected{% endif %}>Married
                        </option>
                        <option value="Widowed" {% if resident.civil_status=='Widowed' %}selected{% endif %}>Widowed
                        </option>
                        <option value="Separated" {% if resident.civil_status=='Separated' %}selected{% endif %}>
                            Separated</option>
                    </select>
                </div>
            </div>

            <div
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem;">
                <div>
                    <label
                        style="display: block; font-weight: 600; font-size: 0.875rem; color: #334155; margin-bottom: 0.35rem;">Purok
                        <span style="color: #dc2626;">*</span></label>
                    <input type="text" name="purok" value="{{ resident.purok }}" required
                        style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; outline: none;"
                        onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.15)';"
                        onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';">
                </div>
                <div>
                    <label
                        style="display: block; font-weight: 600; font-size: 0.875rem; color: #334155; margin-bottom: 0.35rem;">Contact
                        Number <span style="color: #dc2626;">*</span></label>
                    <input type="text" name="contact_number" value="{{ resident.contact_number }}" required
                        style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; outline: none;"
                        onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.15)';"
                        onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';">
                </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label
                    style="display: block; font-weight: 600; font-size: 0.875rem; color: #334155; margin-bottom: 0.35rem;">Complete
                    Address <span style="color: #dc2626;">*</span></label>
                <textarea name="address" rows="2" required
                    style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; outline: none; resize: vertical;"
                    onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.15)';"
                    onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';">{{ resident.address }}</textarea>
            </div>

            <div
                style="display: flex; justify-content: flex-end; align-items: center; gap: 1rem; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #f1f5f9;">
                <a href="{{ url_for('residents_list') }}"
                    style="padding: 0.65rem 1.25rem; background-color: #f1f5f9; color: #475569; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.2s ease;"
                    onmouseover="this.style.backgroundColor='#e2e8f0'; this.style.color='#1e293b';"
                    onmouseout="this.style.backgroundColor='#f1f5f9'; this.style.color='#475569';">
                    Cancel
                </a>
                <button type="submit"
                    style="padding: 0.65rem 1.5rem; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: all 0.2s ease;"
                    onmouseover="this.style.backgroundColor='#1d4ed8'; this.style.boxShadow='0 4px 6px -1px rgba(37,99,235,0.2)';"
                    onmouseout="this.style.backgroundColor='#2563eb'; this.style.boxShadow='0 1px 2px rgba(0,0,0,0.05)';">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
