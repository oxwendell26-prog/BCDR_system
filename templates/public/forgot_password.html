{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 2rem 1rem;">
    <div class="card"
        style="width: 100%; max-width: 420px; background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0;">

        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.75rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem;">Reset Password</h1>
            <p style="color: #64748b; font-size: 0.95rem; margin: 0;">Enter your account details to set a new password.
            </p>
        </div>

        <form method="post" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div>
                <label
                    style="font-weight: 600; display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #475569; text-transform: uppercase; letter-spacing: 0.025em;">Email
                    Address</label>
                <input type="email" name="email" value="{{ email }}" required
                    style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
            </div>

            <div>
                <label
                    style="font-weight: 600; display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #475569; text-transform: uppercase; letter-spacing: 0.025em;">Registered
                    Contact Number</label>
                <input type="text" name="contact_number" placeholder="e.g. 09123456789" required
                    style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
            </div>

            <div>
                <label
                    style="font-weight: 600; display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #475569; text-transform: uppercase; letter-spacing: 0.025em;">New
                    Password</label>
                <input type="password" name="new_password" required placeholder="At least 8 characters"
                    style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
            </div>

            <div>
                <label
                    style="font-weight: 600; display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #475569; text-transform: uppercase; letter-spacing: 0.025em;">Confirm
                    New Password</label>
                <input type="password" name="confirm_password" required
                    style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;">
            </div>

            <button type="submit" class="btn"
                style="width: 100%; margin-top: 0.5rem; padding: 0.75rem; background-color: #1e3a8a; color: white; font-weight: 600; border-radius: 8px; border: none; cursor: pointer;">
                Reset Password
            </button>
        </form>

        <div
            style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: #64748b; border-top: 1px solid #f1f5f9; padding-top: 1.25rem;">
            Remember your password? <a href="{{ url_for('login') }}"
                style="color: #2563eb; text-decoration: none; font-weight: 600;">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
